# Production-grade docker compose for a single-tenant MemoGraph
# deployment on a VPS. Pair with deploy/nginx.conf and deploy/.env.example.
#
# Differences from the dev compose at the repo root:
#  - no exposed application port — everything goes through nginx on 443
#  - read-only root filesystem on the API container
#  - dropped capabilities, no-new-privileges
#  - resource limits (memory, file descriptors)
#  - explicit health-check intervals tuned for production
#  - structured JSON logs enabled
#  - secrets passed via env_file, never inlined here
#
# Usage:
#   cp deploy/.env.example deploy/.env     # then edit
#   docker compose -f deploy/docker-compose.production.yml up -d --build
#
# Backup runbook is in deploy/README.md.

services:
  memograph:
    build:
      context: ..
      dockerfile: Dockerfile
    image: memograph:prod
    container_name: memograph-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MEMOGRAPH_VAULT: /data/vault
      MEMOGRAPH_USE_GAM: "1"
      MEMOGRAPH_LOG_JSON: "1"
      MEMOGRAPH_LOG_LEVEL: "INFO"
    volumes:
      - vault:/data/vault
    # No ports: nginx is the only thing on the host network. The API
    # container is reachable only via the docker network.
    expose:
      - "8000"
    read_only: true
    tmpfs:
      # uvicorn writes a tiny amount of state under /tmp. read_only would
      # otherwise refuse it.
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: memograph-edge
    restart: unless-stopped
    depends_on:
      - memograph
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
      - nginx-cache:/var/cache/nginx
    cap_drop:
      - ALL
    cap_add:
      # nginx needs to bind 80/443 (privileged ports) and chown its
      # workers; alpine nginx already runs them as the nginx user.
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Optional: backup sidecar. Runs `memograph.core.backup.create_backup`
  # on the vault volume nightly and writes archives to ./backups on the
  # host. Comment out if you ship backups via a different mechanism.
  backup:
    image: memograph:prod
    container_name: memograph-backup
    restart: unless-stopped
    depends_on:
      - memograph
    env_file:
      - ./.env
    environment:
      MEMOGRAPH_VAULT: /data/vault
    volumes:
      - vault:/data/vault:ro
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        echo "backup sidecar; cron triggers create_backup at 03:17 UTC"
        # Crude scheduler: sleep until 03:17 UTC each day, run, repeat.
        while :; do
          now=$$(date -u +%H%M)
          target=0317
          if [ "$$now" -lt "$$target" ]; then
            sleep_for=$$(( ( ($$target / 100 - $$now / 100) * 60 \
              + ($$target % 100 - $$now % 100) ) * 60 ))
          else
            sleep_for=$$(( 86400 - ( ($$now / 100 * 60 + $$now % 100) \
              - ($$target / 100 * 60 + $$target % 100) ) * 60 ))
          fi
          [ "$$sleep_for" -gt 0 ] && sleep "$$sleep_for"
          python -m memograph.scripts.run_backup /data/vault /backups || true
        done

volumes:
  vault:
    driver: local
  nginx-cache:
    driver: local
