# Production reverse-proxy config for MemoGraph on a single VPS.
# Pair with deploy/docker-compose.production.yml.
#
# - TLS termination on 443 with HSTS (drop the HSTS line during initial
#   certificate provisioning if you don't want it cached).
# - 80 redirects to 443 except for /.well-known/acme-challenge/ (Let's
#   Encrypt http-01).
# - Proxy timeouts tuned for kernel.search worst case (~10s).
# - /metrics is *not* exposed externally — the upstream serves it on the
#   docker network only, where Prometheus / Grafana Agent should scrape.

worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Real client IP behind the proxy.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr - $remote_user [$time_iso8601] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rid=$http_x_request_id rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # 1 MiB matches the API's MEMOGRAPH_MAX_BODY_BYTES default. Raise both
    # together if you need larger uploads.
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Connect to the API container on the docker network.
    upstream memograph_api {
        server memograph:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ---- HTTP -> HTTPS redirect, plus ACME http-01 challenge passthrough.
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- Main HTTPS server.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS: 1 year, include subdomains. Comment out if you're still
        # provisioning certs and don't want browsers to remember.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Defense in depth headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Reject /metrics from the public internet — internal scrapers only.
        location = /metrics {
            return 404;
        }

        # Liveness/readiness probes returned by the upstream as plain text.
        location ~ ^/(healthz|readyz)$ {
            proxy_pass http://memograph_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location / {
            proxy_pass http://memograph_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Upstream timeouts: kernel.search can take a few seconds on
            # large vaults; allow 30s for the response to start, 60s for
            # streaming bodies, before bailing.
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            send_timeout 30s;

            # Don't buffer responses — keeps streaming endpoints responsive.
            proxy_buffering off;
        }
    }
}
