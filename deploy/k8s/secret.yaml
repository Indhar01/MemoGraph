# Secret for API keys / OIDC client secrets.
#
# Do NOT commit a real key here. Either:
#   1. Create at install time:
#        kubectl -n memograph create secret generic memograph-auth \
#          --from-literal=api-keys="key1,key2"
#   2. Manage with a secrets operator (External Secrets, Sealed Secrets,
#      SOPS+Flux). Delete this file in that case so the operator owns it.
#
# Format: comma-separated bearer tokens.
apiVersion: v1
kind: Secret
metadata:
  name: memograph-auth
  namespace: memograph
  labels:
    app.kubernetes.io/name: memograph
type: Opaque
stringData:
  api-keys: "REPLACE_ME_BEFORE_APPLYING"
