apiVersion: apps/v1
kind: Deployment
metadata:
  name: memograph
  namespace: memograph
  labels:
    app.kubernetes.io/name: memograph
    app.kubernetes.io/part-of: memograph
spec:
  # Vault PVC is RWO. A second pod cannot mount it concurrently, so we
  # Recreate rather than RollingUpdate. Switch to RollingUpdate if you
  # move the vault to an RWX class (EFS, Filestore multishare, NFS).
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memograph
      app.kubernetes.io/instance: memograph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memograph
        app.kubernetes.io/instance: memograph
    spec:
      serviceAccountName: memograph
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memograph
          # Pin to a digest in production: ghcr.io/indhar01/memograph@sha256:...
          image: ghcr.io/indhar01/memograph:0.4.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: memograph-env
          env:
            - name: MEMOGRAPH_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: memograph-auth
                  key: api-keys
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          # /healthz never touches the kernel; /readyz flips green only
          # after startup ingest completes. Startup probe gives the
          # initial ingest up to ~5 minutes before declaring the pod
          # broken; raise failureThreshold for vaults >1 GB.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: vault
              mountPath: /data/vault
            # readOnlyRootFilesystem=true forces writable scratch volumes.
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/memograph
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: memograph-vault
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
