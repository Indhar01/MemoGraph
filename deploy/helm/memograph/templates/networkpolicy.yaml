{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "memograph.fullname" . }}
  labels:
    {{- include "memograph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "memograph.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # API traffic from whitelisted callers only. If ingressFrom is empty
    # the rule still renders (with no `from`) which Kubernetes interprets
    # as "deny all" — fail-closed by design.
    - from:
        {{- range .Values.networkPolicy.ingressFrom }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
    {{- if and .Values.memograph.metricsEnabled .Values.networkPolicy.metricsScrapers }}
    # /metrics is exposed on the same port; restrict it to scrapers only.
    # This rule overlaps with the API rule but the matchLabels are
    # narrower so it's still net-additive.
    - from:
        {{- range .Values.networkPolicy.metricsScrapers }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
  egress:
    # DNS for resolving JWKS URLs, OTLP collectors, OIDC issuers.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS for JWKS/OIDC/OTel and any user-configured outbound deps.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
{{- end -}}
