{{- if and (eq .Values.auth.provider "api_key") (not .Values.auth.apiKey.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memograph.apiKeySecretName" . }}
  labels:
    {{- include "memograph.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Comma-separated keys. Supply at install time via --set-file or a
  # values overlay that lives outside `helm history`:
  #   helm install memograph . --set-file auth.apiKey.keys=./keys.txt
  api-keys: {{ .Values.auth.apiKey.keys | quote }}
{{- end -}}
