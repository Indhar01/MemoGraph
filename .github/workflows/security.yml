name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly Monday 06:17 UTC — catch newly disclosed CVEs against pinned deps
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (static security analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install 'bandit[toml]>=1.7.5'

      - name: Run bandit
        # -ll = report only Medium and High severity. Fail the job on any
        # findings at that level. Lower-severity issues surface in the SARIF
        # upload but don't block the build.
        run: bandit -r memograph/ -ll

      - name: Generate SARIF for code scanning
        if: always()
        run: |
          pip install bandit-sarif-formatter
          bandit -r memograph/ -f sarif -o bandit.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-audit and project deps
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e ".[dev]"

      - name: Run pip-audit
        # --strict promotes warnings to failures; --desc gives human-readable
        # CVE summaries in the log so triagers don't have to follow links.
        run: pip-audit --strict --desc

  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.7.0'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
