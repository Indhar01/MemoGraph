name: Security

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
  schedule:
    # Weekly Monday 06:17 UTC — catch newly disclosed CVEs against pinned deps
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (static security analysis)
    runs-on: ubuntu-latest
    # SARIF upload writes to the GitHub code-scanning API.
    # `security-events: write` is required; `contents: read` is inherited
    # from the workflow-level permissions block. Without this the
    # `github/codeql-action/upload-sarif` step fails with
    # "Resource not accessible by integration".
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install bandit
        # Pinned to a known-good version. Floating to latest causes the job
        # to flip green/red as bandit adds new checks; bump deliberately
        # after vetting locally instead.
        run: |
          python -m pip install --upgrade pip
          pip install 'bandit[toml]==1.7.10'

      - name: Run bandit
        # -ll = report only Medium and High severity. Fail the job on any
        # findings at that level. Lower-severity issues surface in the SARIF
        # upload but don't block the build.
        run: bandit -r memograph/ -ll

      - name: Generate SARIF for code scanning
        if: always()
        run: |
          pip install bandit-sarif-formatter
          bandit -r memograph/ -f sarif -o bandit.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-audit and project deps
        run: |
          # Upgrade pip and setuptools first — runner images often ship an
          # older setuptools that has its own CVEs, which would otherwise
          # fail the audit even though nothing in the project depends on it
          # at runtime.
          python -m pip install --upgrade pip setuptools wheel
          pip install 'pip-audit==2.7.3'
          pip install -e ".[dev]"

      - name: Run pip-audit
        # We audit a generated requirements list that EXCLUDES the project
        # itself, because:
        #   * `pip install -e .` registers `memograph` as an editable
        #     distribution. pip-audit cannot audit editable installs (it
        #     would have to look the local source up on PyPI).
        #   * `--strict` turns that warning into a hard failure even when
        #     `--skip-editable` is set — strict mode treats *any* skip
        #     reason as an error.
        # `pip list --format=freeze --exclude-editable` resolves to exact
        # `package==version` lines for every dep that came from PyPI,
        # which pip-audit can audit deterministically.
        #
        # --desc gives human-readable CVE summaries in the log so triagers
        # don't have to follow links.
        #
        # The --ignore-vuln list is for transitive deps we cannot upgrade
        # from this project (e.g. build-time setuptools). Add new IDs
        # sparingly and only after triage.
        #
        # Ignored:
        #   GHSA-5rjg-fvgr-3xxf  -> setuptools < 78.1.1 (build-time only,
        #                          mitigated by upgrade in install step)
        run: |
          pip list --format=freeze --exclude-editable > installed-deps.txt
          echo "--- Auditing the following resolved deps: ---"
          cat installed-deps.txt
          echo "--- End of dep list ---"
          pip-audit --strict --desc \
            --requirement installed-deps.txt \
            --ignore-vuln GHSA-5rjg-fvgr-3xxf

  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        # Pinned to a known-good version. ruff adds rules in minor releases
        # and a floating `>=0.7.0` flips CI red without source-tree changes.
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.7.4'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
