name: MCP Release Automation

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'server.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.0)'
        required: false

jobs:
  sync-and-validate:
    name: Sync Version & Validate MCP Config
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      needs_update: ${{ steps.check_version.outputs.needs_update }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml tomli
          pip install -e ".[dev]"

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 PyProject Version: $VERSION"

      - name: Check if server.json needs update
        id: check_version
        run: |
          PYPROJECT_VERSION="${{ steps.get_version.outputs.version }}"
          SERVER_VERSION=$(python -c "import json; print(json.load(open('server.json'))['version'])")

          echo "PyProject Version: $PYPROJECT_VERSION"
          echo "Server.json Version: $SERVER_VERSION"

          if [ "$PYPROJECT_VERSION" != "$SERVER_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version mismatch detected!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "✅ Versions are in sync"
          fi

      - name: Update server.json version
        if: steps.check_version.outputs.needs_update == 'true'
        # Pass VERSION via the env block so Python reads it from
        # `os.environ` instead of trying to interpolate `$VERSION` /
        # `{VERSION}` inside the script — those mix bash and Python
        # f-string syntax and the f-string form fails with NameError.
        # Using a single-quoted heredoc (`<<'PY'`) blocks bash from
        # touching anything inside, so the script is unambiguous.
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          python <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          with open("server.json") as f:
              data = json.load(f)
          data["version"] = version
          if data.get("packages"):
              data["packages"][0]["version"] = version
          with open("server.json", "w") as f:
              json.dump(data, f, indent=2)
          print(f"✅ Updated server.json to version {version}")
          PY

      - name: Validate server.json
        run: |
          python scripts/verify_mcp_registry.py

      - name: Commit version sync
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add server.json
          git commit -m "chore: sync server.json version to ${{ steps.get_version.outputs.version }}"
          git push

  publish-to-mcp-registry:
    name: Publish to MCP Registry
    needs: sync-and-validate
    runs-on: ubuntu-latest
    # Endpoint: https://registry.modelcontextprotocol.io
    # The namespace `io.github.Indhar01/memograph` is GitHub-bound, so
    # publishing requires a GitHub OIDC token. No PAT / repo secret is
    # needed; `id-token: write` is the authoritative grant.
    #
    # Field-format lesson (from a manual publish that hit a 422):
    # mcp-publisher v1.0.0 (Sep 2025) serialised the package metadata
    # with snake_case (`registry_type`), but the registry schema since
    # 2025-12-11 requires camelCase (`registryType`). Always installing
    # `releases/latest` below avoids that class of bug — CI will be one
    # release behind upstream at worst.
    if: github.event_name == 'release' || github.event_name == 'push'
    permissions:
      contents: read
      id-token: write   # OIDC token issuance for mcp-publisher login

    steps:
      - name: Checkout (so server.json is on disk)
        uses: actions/checkout@v4
        with:
          # If the version sync step pushed a commit, fetch it so we
          # publish with the up-to-date server.json.
          ref: main
          fetch-depth: 1

      - name: Set up Python (for the pre/post verify steps)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install mcp-publisher (latest release)
        # Always pull `releases/latest`. The schema-version trap we hit
        # locally (v1.0.0 sending snake_case fields to a camelCase
        # registry) can only happen if the binary is months old. Latest
        # is the safest pin for a low-frequency release pipeline.
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          echo "Downloading: $url"
          curl -fsSL "$url" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Print mcp-publisher version (debug aid)
        # Surfaced on every run so a future schema break is immediately
        # diagnosable from the log alone — no need to re-derive which
        # binary was in use.
        run: |
          ./mcp-publisher --version
          echo "---"
          ./mcp-publisher --help | head -10

      - name: "Pre-publish: validate server.json locally"
        # Catches schema breakage (wrong field name, missing required
        # property, namespace mismatch) before we hit the registry's
        # 422 response, with much clearer error messages.
        run: python scripts/verify_mcp_registry.py

      - name: Login to MCP Registry via GitHub OIDC
        # `github-oidc` mode exchanges the workflow's OIDC token for a
        # registry JWT. The token's `repository_owner` claim
        # (`Indhar01`) is matched against the namespace owner
        # (`io.github.Indhar01`) — no human, no device code, no
        # browser. Requires `id-token: write` on this job.
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json (idempotent on re-runs)
        # `mcp-publisher publish` returns non-zero when the version
        # already exists. That's fine for re-runs against an already
        # published version — we treat the "already exists" path as
        # success so a workflow re-trigger doesn't fail loudly.
        # Any *other* error still fails the step.
        run: |
          set +e
          out=$(./mcp-publisher publish 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -eq 0 ]; then
            echo "::notice::Published successfully."
            exit 0
          fi
          if echo "$out" | grep -qiE "already exists|version.*conflict|409"; then
            echo "::warning::Version already published — treating as success."
            exit 0
          fi
          echo "::error::mcp-publisher publish failed (rc=$rc) and not an 'already exists' case."
          exit $rc

      - name: "Post-publish: verify the registry has the new version"
        # Re-fetch from the live registry to confirm the publish landed
        # (or the prior publish is still healthy in the re-run case).
        run: python scripts/verify_mcp_registry.py

  summary:
    name: Release Summary
    needs: [sync-and-validate, publish-to-mcp-registry]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# 🚀 MCP Release Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Version: ${{ needs.sync-and-validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Automated Tasks:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Version sync (server.json)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Configuration validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Published to MCP Registry via mcp-publisher (OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [PyPI Package](https://pypi.org/project/memograph/)" >> $GITHUB_STEP_SUMMARY
          echo "- [MCP Registry entry](https://registry.modelcontextprotocol.io/v0/servers?search=io.github.Indhar01/memograph)" >> $GITHUB_STEP_SUMMARY
