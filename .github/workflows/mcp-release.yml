name: MCP Release Automation

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'server.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.0)'
        required: false

jobs:
  sync-and-validate:
    name: Sync Version & Validate MCP Config
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      needs_update: ${{ steps.check_version.outputs.needs_update }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml tomli
          pip install -e ".[dev]"

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 PyProject Version: $VERSION"

      - name: Check if server.json needs update
        id: check_version
        run: |
          PYPROJECT_VERSION="${{ steps.get_version.outputs.version }}"
          SERVER_VERSION=$(python -c "import json; print(json.load(open('server.json'))['version'])")

          echo "PyProject Version: $PYPROJECT_VERSION"
          echo "Server.json Version: $SERVER_VERSION"

          if [ "$PYPROJECT_VERSION" != "$SERVER_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version mismatch detected!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "✅ Versions are in sync"
          fi

      - name: Update server.json version
        if: steps.check_version.outputs.needs_update == 'true'
        # Pass VERSION via the env block so Python reads it from
        # `os.environ` instead of trying to interpolate `$VERSION` /
        # `{VERSION}` inside the script — those mix bash and Python
        # f-string syntax and the f-string form fails with NameError.
        # Using a single-quoted heredoc (`<<'PY'`) blocks bash from
        # touching anything inside, so the script is unambiguous.
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          python <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          with open("server.json") as f:
              data = json.load(f)
          data["version"] = version
          if data.get("packages"):
              data["packages"][0]["version"] = version
          with open("server.json", "w") as f:
              json.dump(data, f, indent=2)
          print(f"✅ Updated server.json to version {version}")
          PY

      - name: Validate server.json
        run: |
          python scripts/verify_mcp_registry.py

      - name: Commit version sync
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add server.json
          git commit -m "chore: sync server.json version to ${{ steps.get_version.outputs.version }}"
          git push

  publish-to-mcp-registry:
    name: Publish to MCP Registry
    needs: sync-and-validate
    runs-on: ubuntu-latest
    # Endpoint: https://registry.modelcontextprotocol.io
    # The namespace `io.github.Indhar01/memograph` is GitHub-bound, so
    # publishing requires a GitHub OIDC token. No PAT / repo secret is
    # needed; `id-token: write` is the authoritative grant.
    if: github.event_name == 'release' || github.event_name == 'push'
    permissions:
      contents: read
      id-token: write   # OIDC token issuance for mcp-publisher login

    steps:
      - name: Checkout (so server.json is on disk)
        uses: actions/checkout@v7
        with:
          # If the version sync step pushed a commit, fetch it so we
          # publish with the up-to-date server.json.
          ref: main
          fetch-depth: 1

      - name: Install mcp-publisher
        # Pull the latest publisher binary for the runner's arch and
        # extract just the executable into the working dir.
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher
          ./mcp-publisher --help | head -5

      - name: Login to MCP Registry via GitHub OIDC
        # The `github-oidc` login mode uses the workflow's OIDC token to
        # claim the `io.github.<owner>` namespace — no secret needed,
        # which is why `id-token: write` is required at the job level.
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        # Reads server.json in the working dir and POSTs it to
        # registry.modelcontextprotocol.io. Reports the published
        # name + version on success.
        run: ./mcp-publisher publish

      - name: Verify the publish landed
        run: python scripts/verify_mcp_registry.py

  summary:
    name: Release Summary
    needs: [sync-and-validate, publish-to-mcp-registry]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# 🚀 MCP Release Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Version: ${{ needs.sync-and-validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Automated Tasks:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Version sync (server.json)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Configuration validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Published to MCP Registry via mcp-publisher (OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [PyPI Package](https://pypi.org/project/memograph/)" >> $GITHUB_STEP_SUMMARY
          echo "- [MCP Registry entry](https://registry.modelcontextprotocol.io/v0/servers?search=io.github.Indhar01/memograph)" >> $GITHUB_STEP_SUMMARY
