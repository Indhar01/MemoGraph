title: "[Show & tell] "
labels: ["show-and-tell"]
body:
  - type: markdown
    attributes:
      value: |
        ## Show what you built

        Share how you're using MemoGraph — integrations, custom adapters,
        team workflows, vault designs, AI agent setups. Screenshots and
        short videos welcome.

  - type: textarea
    id: what
    attributes:
      label: What you built
      description: One or two sentences.
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How it works
      description: Architecture, key choices, what surprised you.
    validations:
      required: false

  - type: input
    id: link
    attributes:
      label: Link (repo, blog post, video, screenshot)
      placeholder: "https://…"
    validations:
      required: false

  - type: textarea
    id: feedback
    attributes:
      label: What would have helped?
      description: Anything missing in MemoGraph that you had to work around?
    validations:
      required: false
